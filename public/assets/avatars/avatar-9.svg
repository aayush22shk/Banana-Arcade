<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071b30" />
      <stop offset="100%" stop-color="#020810" />
    </radialGradient>
    <filter id="glow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00d2d3" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg9)" stroke="#00d2d3" stroke-width="2.5" />
  <!-- Wizard Hat -->
  <polygon points="50,14 26,44 74,44" fill="#341f97" filter="url(#glow9)" />
  <!-- Hat Brim -->
  <ellipse cx="50" cy="44" rx="30" ry="7" fill="#5f27cd" />
  <circle cx="50" cy="38" r="4" fill="#00d2d3" />
  <!-- Beard / Robe Collar -->
  <polygon points="50,78 30,50 70,50" fill="#c8d6e5" />
  <!-- Face area -->
  <polygon points="50,62 36,46 64,46" fill="#341f97" />
  <!-- Mystical Glowing Eyes -->
  <circle cx="43" cy="50" r="3" fill="#00d2d3" filter="url(#glow9)" />
  <circle cx="57" cy="50" r="3" fill="#00d2d3" filter="url(#glow9)" />
</svg>
