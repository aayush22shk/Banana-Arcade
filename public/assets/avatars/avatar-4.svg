<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a082e" />
      <stop offset="100%" stop-color="#120616" />
    </radialGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e056fd" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg4)" stroke="#e056fd" stroke-width="2.5" />
  <!-- Pixel Space Invader Shape -->
  <g fill="#e056fd" filter="url(#glow4)">
    <!-- Horns -->
    <rect x="32" y="24" width="6" height="8" />
    <rect x="62" y="24" width="6" height="8" />
    <!-- Body Core -->
    <rect x="26" y="32" width="48" height="24" rx="2" />
    <!-- Eyes Cutout (represented with dark pixels) -->
    <rect x="34" y="38" width="8" height="8" fill="#120616" />
    <rect x="58" y="38" width="8" height="8" fill="#120616" />
    <circle cx="38" cy="42" r="2" fill="#ff7979" />
    <circle cx="62" cy="42" r="2" fill="#ff7979" />
    <!-- Tentacles / Legs -->
    <rect x="22" y="44" width="6" height="18" />
    <rect x="72" y="44" width="6" height="18" />
    <rect x="32" y="56" width="8" height="12" />
    <rect x="60" y="56" width="8" height="12" />
    <rect x="44" y="56" width="12" height="6" />
  </g>
</svg>
