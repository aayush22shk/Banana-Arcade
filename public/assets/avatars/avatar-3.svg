<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a12" />
      <stop offset="100%" stop-color="#09140b" />
    </radialGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff88" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg3)" stroke="#00ff88" stroke-width="2.5" />
  <!-- Antenna -->
  <line x1="50" y1="26" x2="50" y2="16" stroke="#00ff88" stroke-width="2.5" />
  <circle cx="50" cy="15" r="4" fill="#00ff88" filter="url(#glow3)" />
  <!-- Bot Head -->
  <rect x="26" y="26" width="48" height="42" rx="8" fill="#1f2937" stroke="#4ade80" stroke-width="2"/>
  <!-- Ears -->
  <rect x="20" y="38" width="6" height="18" rx="2" fill="#00ff88" />
  <rect x="74" y="38" width="6" height="18" rx="2" fill="#00ff88" />
  <!-- Screen Eyes -->
  <rect x="32" y="34" width="36" height="16" rx="4" fill="#0f172a" />
  <circle cx="41" cy="42" r="4" fill="#00ff88" filter="url(#glow3)"/>
  <circle cx="59" cy="42" r="4" fill="#00ff88" filter="url(#glow3)"/>
  <!-- Mouth Grid -->
  <line x1="36" y1="58" x2="64" y2="58" stroke="#00ff88" stroke-width="2" stroke-dasharray="3,2"/>
</svg>
