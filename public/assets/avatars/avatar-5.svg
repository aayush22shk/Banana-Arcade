<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#361505" />
      <stop offset="100%" stop-color="#150a04" />
    </radialGradient>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="100%" stop-color="#e17055" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff7675" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg5)" stroke="#ff7675" stroke-width="2.5" />
  <!-- Ears -->
  <polygon points="26,22 42,40 22,44" fill="url(#foxGrad)" />
  <polygon points="74,22 58,40 78,44" fill="url(#foxGrad)" />
  <polygon points="28,26 38,38 26,42" fill="#ffeaa7" />
  <polygon points="72,26 62,38 74,42" fill="#ffeaa7" />
  <!-- Face -->
  <polygon points="50,76 22,44 78,44" fill="url(#foxGrad)" filter="url(#glow5)"/>
  <polygon points="50,76 34,44 66,44" fill="#ffffff" opacity="0.9"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="48" rx="4" ry="2.5" transform="rotate(-15 38 48)" fill="#00cec9" />
  <ellipse cx="62" cy="48" rx="4" ry="2.5" transform="rotate(15 62 48)" fill="#00cec9" />
  <!-- Nose -->
  <circle cx="50" cy="71" r="3.5" fill="#2d3436" />
</svg>
